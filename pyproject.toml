[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-volume"
version = "0.1.0"
description = "Differentiable PyTorch wave-optics: volumetric refractive-index scenes and optical components for brightfield, coded wavefront sensing and other imaging pipelines."
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Syed Kazim", email = "kazimsyed4@gmail.com" },
]
keywords = [
  "wave optics", "beam propagation method", "pytorch", "differentiable simulation",
  "quantitative phase imaging", "wavefront sensing", "microscopy",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]
# Core runtime dependencies only: everything needed for `import optical_volume`.
# torch/torchvision are installed from PyPI by default; install a specific
# CUDA build first (see README) if you need one.
dependencies = [
  "numpy>=1.24",
  "torch>=2.4.0",
  "torchvision>=0.19.1",
]

[project.optional-dependencies]
# 2D plotting helpers in optical_volume.utils / optical_volume.visualization
plot = ["matplotlib>=3.7"]
# 3D volume rendering in optical_volume.visualization (heavy; conda is often easier)
mayavi = ["mayavi>=4.8"]
# Everything the example scripts and notebooks use
examples = ["matplotlib>=3.7", "tifffile>=2023.7.10", "jupyter"]
test = ["pytest>=7"]
dev = ["pytest>=7", "build", "matplotlib>=3.7", "tifffile>=2023.7.10"]

[project.urls]
Homepage = "https://github.com/Muhammad-Kazim/OptiVolume"
Repository = "https://github.com/Muhammad-Kazim/OptiVolume"
Issues = "https://github.com/Muhammad-Kazim/OptiVolume/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["optical_volume*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
